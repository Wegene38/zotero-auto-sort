<?xml version="1.0" encoding="UTF-8"?>
<?xml-stylesheet href="chrome://global/skin/global.css" type="text/css"?>
<?xml-stylesheet href="chrome://autosort/content/dialog.css" type="text/css"?>
<window xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
        xmlns:html="http://www.w3.org/1999/xhtml"
        id="autosort-window"
        title="自动分类文献"
        windowtype="autosort:dialog"
        width="760" height="680">
  <html:div id="root">
    <html:header>
      <html:h1>自动分类文献</html:h1>
      <html:p id="scope" class="muted"></html:p>
    </html:header>

    <html:div class="controls">
      <html:label>分类数量
        <html:input id="k" type="number" min="2" max="30" placeholder="自动"/>
      </html:label>
      <html:label><html:input id="multi" type="checkbox" checked="checked"/>允许一篇文献属于多个分类</html:label>
      <html:label id="subs-label" hidden="hidden"><html:input id="subs" type="checkbox" checked="checked"/>包含子分类中的文献</html:label>
      <html:button id="rescan">重新生成</html:button>
    </html:div>

    <html:div id="status" class="status">正在扫描…</html:div>

    <html:div class="list-tools">
      <html:button id="select-all" class="link">全选</html:button>
      <html:button id="select-none" class="link">全不选</html:button>
      <html:span class="muted">勾选要创建的分类，名称可以直接修改；点“预览”查看包含的文献。</html:span>
    </html:div>

    <html:ul id="list"></html:ul>

    <html:footer>
      <html:label>放入父分类
        <html:input id="parent-name" type="text"/>
      </html:label>
      <html:span id="summary" class="muted"></html:span>
      <html:button id="cancel">取消</html:button>
      <html:button id="apply" class="primary" disabled="disabled">创建分类</html:button>
    </html:footer>
  </html:div>
  <script src="chrome://autosort/content/dialog.js"/>
</window>
